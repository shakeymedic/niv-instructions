<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-labelledby="t d">
<title id="t">Flow sensor calibration: the 180° flips</title>
<desc id="d">Three rows. 1, Attach: circuit, then flow sensor, then the next component (for example an HMEF), then the calibration adapter. 2, Flip all three 180 degrees so the calibration adapter connects directly to the circuit. 3, Flip back 180 degrees so the flow sensor connects directly to the circuit, then remove the calibration adapter.</desc>
<defs>
  <path id="tube" d="M0 0H34" stroke="#9fb0c3" stroke-width="18"/>
  <g id="fs"><rect width="104" height="30" rx="7" fill="#fde68a" stroke="#1f3550" stroke-width="2"/><text x="52" y="20" text-anchor="middle">Flow sensor</text></g>
  <g id="hm"><rect width="104" height="30" rx="7" fill="#e2e8f0" stroke="#1f3550" stroke-width="2"/><text x="52" y="20" text-anchor="middle">Component</text></g>
  <g id="ad"><rect width="104" height="30" rx="7" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/><text x="52" y="20" text-anchor="middle">Cal. adapter</text></g>
</defs>
<g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#0f1b2d">
  <circle cx="16" cy="18" r="13" fill="#ea580c"/><text x="16" y="23" fill="#fff" font-weight="700" text-anchor="middle">1</text>
  <text x="38" y="23" font-weight="700" font-size="16">Attach the adapter</text>
  <use href="#tube" x="0" y="57"/>
  <g transform="translate(34 42)"><use href="#fs"/><use href="#hm" x="108"/><use href="#ad" x="216"/></g>

  <circle cx="16" cy="114" r="13" fill="#ea580c"/><text x="16" y="119" fill="#fff" font-weight="700" text-anchor="middle">2</text>
  <text x="38" y="119" font-weight="700" font-size="16">Flip all three 180°</text><text x="196" y="119" font-size="14" fill="#4a5b70">(when prompted)</text>
  <use href="#tube" x="0" y="153"/>
  <g transform="translate(34 138)"><use href="#ad"/><use href="#hm" x="108"/><use href="#fs" x="216"/></g>

  <circle cx="16" cy="210" r="13" fill="#ea580c"/><text x="16" y="215" fill="#fff" font-weight="700" text-anchor="middle">3</text>
  <text x="38" y="215" font-weight="700" font-size="16">Flip back 180°, remove adapter</text>
  <use href="#tube" x="0" y="249"/>
  <g transform="translate(34 234)"><use href="#fs"/><use href="#hm" x="108"/><g opacity=".4"><use href="#ad" x="230"/></g></g>
  <text x="314" y="285" font-size="13" fill="#9a3412" text-anchor="middle">removed</text>
</g>
</svg>
