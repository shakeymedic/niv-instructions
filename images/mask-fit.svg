<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="t d">
<title id="t">Fitting a full face mask</title>
<desc id="d">Side view of a patient's head. A clinician's gloved hand holds a full face mask over the nose and mouth. The cushion sits from the bridge of the nose to just below the lower lip, clear of the eyes. Headgear straps go evenly round the head.</desc>
<g font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" fill="#0f1b2d">
<g fill="none" stroke="#1f3550" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- head in profile, facing right -->
  <path d="M248 70C258 84 262 98 262 110C262 116 258 120 258 124L284 156C284 162 278 164 270 164L268 170C274 172 274 178 268 180C272 182 272 188 266 190C262 194 262 198 266 204C268 214 258 222 246 222L226 224L226 272H150L154 232C116 210 108 130 140 90C170 50 230 50 248 70Z" fill="#f6dcc8"/>
  <path d="M140 92C168 52 232 52 248 72C226 70 190 76 168 96C158 106 150 120 146 132C134 120 132 104 140 92Z" fill="#6b4f3a" stroke="#6b4f3a"/>
  <path d="M190 138C182 138 180 158 190 162C196 158 196 142 190 138Z"/>
  <path d="M240 108C244 105 250 105 253 108"/>
  <!-- headgear straps -->
  <path d="M256 130L160 104" stroke="#0369a1" stroke-width="4"/>
  <path d="M264 198L170 202" stroke="#0369a1" stroke-width="4"/>
  <!-- full face mask: bridge of nose to just below the lower lip -->
  <path d="M252 126C270 124 300 146 302 168C304 186 290 202 262 204C258 190 258 150 252 126Z" fill="#e0f2fe" fill-opacity=".8" stroke="#0369a1" stroke-width="3"/>
  <!-- standard elbow and tubing -->
  <path d="M300 174H324V200" stroke="#1e4a7d" stroke-width="12" stroke-linecap="butt"/>
  <path d="M324 200V262" stroke="#9fb0c3" stroke-width="14" stroke-linecap="butt"/>
  <!-- gloved hand holding the mask -->
  <path d="M282 140C292 130 312 130 322 140L392 124L398 152L326 168C312 172 294 166 286 156Z" fill="#b9c8f0"/>
  <path d="M290 150C300 156 312 156 320 150"/>
</g>
<g stroke="#4a5b70" stroke-width="1.5">
  <path d="M256 126L300 44"/>
  <path d="M264 204L300 276"/>
</g>
<text x="300" y="36" text-anchor="middle" font-weight="700">Bridge of nose</text>
<text x="300" y="292" text-anchor="middle" font-weight="700">Just below the lower lip</text>
<text x="404" y="112" font-weight="700">Hold by hand</text>
<text x="404" y="134" font-weight="700">first</text>
<text x="340" y="218">Then headgear, evenly.</text>
<text x="340" y="242" fill="#b42318" font-weight="700">Do not overtighten.</text>
</g>
</svg>
